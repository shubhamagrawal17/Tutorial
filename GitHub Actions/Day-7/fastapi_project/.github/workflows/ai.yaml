name: AI CI/CD Pipeline

on: workflow_dispatch

env:
  IMAGE_NAME: fastapi-app

jobs:

  test:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html || true

      - name: Run Tests
        run: |
          pytest \
          --junitxml=report.xml \
          --cov=app \
          --cov-report=xml \
          --cov-report=html \
          --html=report.html \
          --self-contained-html \
          --cov-fail-under=80

      - name: Extract Coverage %
        run: |
          python <<EOF
          import xml.etree.ElementTree as ET
          import json
          tree = ET.parse("coverage.xml")
          root = tree.getroot()
          coverage = float(root.attrib.get("line-rate", 0)) * 100
          with open("status.json", "w") as f:
              json.dump({
                  "tests": "passed",
                  "coverage": round(coverage, 2),
                  "lint": "unknown",
                  "security": "unknown",
                  "dependency": "unknown"
              }, f)
          EOF

      - name: Upload Test Reports + Status
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            report.xml
            report.html
            coverage.xml
            htmlcov/
            status.json

  lint:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: test-report

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linter
        run: pip install flake8 flake8-html

      - name: Run Lint
        run: |
          flake8 . --format=html --htmldir=flake8-report || true
          ERRORS=$(flake8 . --count --max-line-length=120 2>/dev/null | tail -n 1)

          python <<EOF
          import json
          with open("status.json") as f:
              status = json.load(f)
          try:
              errors = int("$ERRORS".strip())
          except:
              errors = 1
          status["lint"] = "warning" if errors > 0 else "passed"
          with open("status.json", "w") as f:
              json.dump(status, f)
          EOF

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            flake8-report
            status.json

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lint-report

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Security Scan
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ -f html -o bandit-report.html || true

          python <<EOF
          import json
          with open("status.json") as f:
              status = json.load(f)
          data = json.load(open("bandit-report.json"))
          issues = data.get("results", [])
          status["security"] = "passed" if len(issues) == 0 else "warning"
          with open("status.json", "w") as f:
              json.dump(status, f)
          EOF

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            bandit-report.*
            status.json

  dependency-scan:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: security-report

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies + pip-audit
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run Dependency Scan
        run: |
          pip-audit -r requirements.txt -f json -o dependency-report.json || true

          python <<EOF
          import json
          with open("status.json") as f:
              status = json.load(f)
          data = json.load(open("dependency-report.json"))
          vulns = sum(len(dep.get("vulns", [])) for dep in data.get("dependencies", []))
          status["dependency"] = "passed" if vulns == 0 else "warning"
          with open("status.json", "w") as f:
              json.dump(status, f)
          EOF

      - name: Upload Dependency Reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: |
            dependency-report.json
            status.json

  ai-analysis:
    runs-on: ubuntu-latest
    needs: dependency-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dependency-report

      - name: Prepare AI Input
        run: cat status.json > ai-input.txt

      - name: Call AI API (FIXED)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          INPUT=$(cat ai-input.txt)
      
          JSON_PAYLOAD=$(jq -n \
            --arg text "You are a senior DevOps engineer. Analyze this CI/CD pipeline result and suggest improvements:\n$INPUT" \
            '{
              model: "gpt-4.1",
              input: [
                {
                  role: "user",
                  content: [
                    {
                      type: "input_text",
                      text: $text
                    }
                  ]
                }
              ]
            }')
      
          curl https://api.openai.com/v1/responses \
            -s \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            > ai-response.json

          

      - name: Debug AI Response
        run: cat ai-response.json

      - name: Extract AI Summary (Robust)
        run: |
          python <<EOF
          import json

          data = json.load(open("ai-response.json"))
          text = ""

          for item in data.get("output", []):
              for content in item.get("content", []):
                  if content.get("type") == "output_text":
                      text += content.get("text", "") + "\\n"

          if not text:
              text = data.get("output_text", "")

          if not text:
              text = json.dumps(data, indent=2)

          with open("ai-report.txt", "w") as f:
              f.write(text)

          print(text)
          EOF

      - name: Show AI Summary in UI
        run: |
          echo "## 🤖 AI DevOps Insights" >> $GITHUB_STEP_SUMMARY
          cat ai-report.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload AI Report
        uses: actions/upload-artifact@v4
        with:
          name: ai-report
          path: ai-report.txt

  deploy-report:
    runs-on: ubuntu-latest
    needs: ai-analysis
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Prepare Site
        run: |
          mkdir -p site
          cp reports/index.html site/index.html
          touch site/.nojekyll

          mkdir -p site/test-report
          mkdir -p site/lint-report
          mkdir -p site/security-report
          mkdir -p site/dependency-report
          mkdir -p site/ai-report

          cp -r test-report/* site/test-report/ || true
          cp -r lint-report/* site/lint-report/ || true
          cp -r security-report/* site/security-report/ || true
          cp -r dependency-report/* site/dependency-report/ || true
          cp -r ai-report/* site/ai-report/ || true

          cp dependency-report/status.json site/status.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          publish_dir: ./site
          force_orphan: true
